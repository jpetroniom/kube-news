# Etapa 1 do laboratório (ADR 001): app + PostgreSQL.
# Não rodar junto com o cluster kind — a RAM do WSL não comporta os dois.
services:
  app:
    build: ./src
    image: ${IMAGE:-kube-news:local}
    ports:
      - "8080:8080"
    environment:
      DB_DATABASE: kubedevnews
      DB_USERNAME: kubedevnews
      DB_PASSWORD: "Pg#123"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_SSL_REQUIRE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: kubedevnews
      POSTGRES_USER: kubedevnews
      POSTGRES_PASSWORD: "Pg#123"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubedevnews -d kubedevnews"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
